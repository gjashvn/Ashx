<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Axi-Music Player</title>
  <style>
    :root {
      --bg-dark: #0a0a0a;
      --card-bg: #141414;
      --accent-red: #ff1e27;
      --accent-red-hover: #d90f17;
      --text-main: #ffffff;
      --text-muted: #aaaaaa;
      --border-color: #262626;
      --item-bg: #1f1f1f;
      --item-hover: #2a2a2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ==========================================================
       SECRET CODE ACCESS SCREEN STYLES
    ========================================================== */
    .access-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(10, 10, 10, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease, transform 0.5s ease;
    }

    .access-overlay.unlocked {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.05);
      pointer-events: none;
    }

    .access-card {
      background: linear-gradient(145deg, #181818, #111111);
      width: 90%;
      max-width: 400px;
      padding: 36px 28px;
      border-radius: 24px;
      border: 1px solid rgba(255, 30, 39, 0.25);
      box-shadow: 0 15px 35px rgba(255, 30, 39, 0.2), 0 30px 60px rgba(0, 0, 0, 0.9);
      text-align: center;
      animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .lock-icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(255, 30, 39, 0.1);
      border: 1px solid var(--accent-red);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      color: var(--accent-red);
      box-shadow: 0 0 20px rgba(255, 30, 39, 0.3);
    }

    .access-card h3 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .access-card p {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .pin-input-box {
      margin-bottom: 16px;
      position: relative;
    }

    .pin-input-box input {
      width: 100%;
      padding: 14px 18px;
      background-color: #0d0d0d;
      border: 2px solid var(--border-color);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 18px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      transition: all 0.25s ease;
    }

    .pin-input-box input:focus {
      border-color: var(--accent-red);
      box-shadow: 0 0 15px rgba(255, 30, 39, 0.35);
      background-color: #121212;
    }

    .pin-input-box input::placeholder {
      letter-spacing: 1px;
      font-size: 13px;
      color: #555;
    }

    .unlock-btn {
      width: 100%;
      padding: 14px;
      border: none;
      background: linear-gradient(135deg, #ff1e27, #b30007);
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 30, 39, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .unlock-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 30, 39, 0.6);
    }

    .unlock-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      font-size: 12px;
      color: #ff4d4d;
      margin-top: 12px;
      min-height: 18px;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    /* Shake animation on wrong code */
    .shake {
      animation: shakeAnim 0.4s ease-in-out;
    }

    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    /* ==========================================================
       MAIN APP STYLES
    ========================================================== */
    .player-card {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 28px 22px 16px 22px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 30px rgba(255, 30, 39, 0.15), 0 20px 40px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .brand-logo {
      width: 12px;
      height: 12px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-red);
    }

    h2 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-main);
      text-align: center;
    }

    .subtitle {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 18px;
      text-align: center;
    }

    /* Tabs Bar */
    .tabs-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: #181818;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--accent-red);
      color: var(--text-main);
    }

    /* Search Bar & Auto-Suggestions */
    .search-container {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box {
      display: flex;
      background-color: var(--item-bg);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-box:focus-within {
      border-color: var(--accent-red);
      box-shadow: 0 0 12px rgba(255, 30, 39, 0.3);
    }

    .search-box input {
      flex: 1;
      padding: 12px 14px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .search-box button {
      padding: 0 18px;
      border: none;
      background-color: var(--accent-red);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .search-box button:hover {
      background-color: var(--accent-red-hover);
    }

    /* Live Suggestion Dropdown */
    .suggestions-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background-color: #1a1a1a;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-top: 5px;
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 20px rgba(0,0,0,0.8);
      display: none;
    }

    .suggestion-item {
      padding: 10px 14px;
      font-size: 13px;
      color: #ddd;
      cursor: pointer;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-item:hover {
      background-color: var(--accent-red);
      color: #fff;
    }

    .suggestion-item .artist-tag {
      font-size: 11px;
      opacity: 0.7;
    }

    /* Quick Chips */
    .rec-chips {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .rec-chips::-webkit-scrollbar { display: none; }

    .chip {
      background: var(--item-bg);
      border: 1px solid var(--border-color);
      color: #ccc;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .chip:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    /* Track List with Album Art Covers */
    .results-list {
      list-style: none;
      max-height: 230px;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 4px;
    }

    .results-list::-webkit-scrollbar { width: 5px; }
    .results-list::-webkit-scrollbar-thumb {
      background: #333333;
      border-radius: 3px;
    }

    .track-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      background-color: var(--item-bg);
      border: 1px solid transparent;
      margin-bottom: 8px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .track-item:hover {
      background-color: var(--item-hover);
      border-color: #333333;
    }

    .track-item.active {
      background-color: #251213;
      border: 1px solid var(--accent-red);
    }

    .track-item img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .track-info { flex: 1; overflow: hidden; text-align: left; }

    .track-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fav-btn {
      background: none;
      border: none;
      color: #666;
      font-size: 16px;
      cursor: pointer;
      padding: 5px;
    }

    .fav-btn.active, .fav-btn:hover { color: var(--accent-red); }

    /* Controls */
    .custom-player-controls {
      background-color: #121212;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
    }

    .btn-circle {
      background: #1f1f1f;
      border: 1px solid #333;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.2s ease;
    }

    .btn-circle:hover {
      border-color: var(--accent-red);
      color: var(--accent-red);
    }

    .btn-play-pause {
      background-color: var(--accent-red);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(255, 30, 39, 0.4);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-play-pause:hover {
      transform: scale(1.05);
      background-color: var(--accent-red-hover);
    }

    .progress-bar-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--text-muted);
    }

    .progress-bar {
      flex: 1;
      height: 4px;
      background: #333333;
      border-radius: 2px;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .progress-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--accent-red);
      cursor: pointer;
    }

    audio { display: none; }

    .player-footer {
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
    }

    .player-footer span {
      color: var(--text-main);
      font-weight: 600;
    }

    .loading-spinner {
      text-align: center;
      padding: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>

  <!-- ==========================================================
       SECRET CODE ENTRY SCREEN OVERLAY
  ========================================================== -->
  <div class="access-overlay" id="access-overlay">
    <div class="access-card" id="access-card">
      <div class="lock-icon-wrapper">
        <svg width="26" height="26" fill="currentColor" viewBox="0 0 16 16">
          <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/>
        </svg>
      </div>
      <h3>Protected Access</h3>
      <p>Enter the secret passcode to unlock Axi Music</p>
      
      <div class="pin-input-box">
        <input type="password" id="secret-passcode" placeholder="ENTER CODE" maxlength="10" autocomplete="off" autofocus />
      </div>
      
      <button class="unlock-btn" id="unlock-btn">UNLOCK PLAYER</button>
      <div class="error-msg" id="error-msg"></div>
    </div>
  </div>

  <!-- ==========================================================
       MAIN PLAYER CONTENT
  ========================================================== -->
  <div class="player-card">
    <div class="brand-header">
      <div class="brand-logo"></div>
      <h2>A - S O N G S </h2>
    </div>
    <div class="subtitle">Pure Hindi Experience (Instant Stream Engine)</div>

    <!-- Navigation Tabs -->
    <div class="tabs-bar">
      <button class="tab-btn active" id="tab-search" onclick="switchTab('search')">🔍 Hindi Songs</button>
      <button class="tab-btn" id="tab-mixes" onclick="switchTab('mixes')">📻 Long Mixes</button>
      <button class="tab-btn" id="tab-favs" onclick="switchTab('favs')">❤️ Favorites</button>
    </div>

    <!-- Search Section -->
    <div id="search-section">
      <div class="search-container">
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Search song name..." autocomplete="off" />
          <button id="search-btn">Search</button>
        </div>
        <!-- Live Suggestions Dropdown -->
        <div class="suggestions-dropdown" id="suggestions-box"></div>
      </div>

      <!-- Quick Category Chips -->
      <div class="rec-chips">
        <span class="chip" onclick="quickSearch('Zalim')">🔥 Zalim</span>
        <span class="chip" onclick="quickSearch('Lag Ja Gale')">🌹 Lag Ja Gale</span>
        <span class="chip" onclick="quickSearch('Apna Bana Le')">✨ Apna Bana Le</span>
        <span class="chip" onclick="quickSearch('Arijit Singh')">🎤 Arijit Singh</span>
        <span class="chip" onclick="quickSearch('Tum Se Hi')">❤️ Tum Se Hi</span>
      </div>
    </div>

    <!-- Song List Display -->
    <ul class="results-list" id="results-list"></ul>

    <!-- Controls -->
    <div class="custom-player-controls">
      <div class="control-row">
        <button class="btn-circle" onclick="prevSong()">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11 3.5a.5.5 0 0 1 .5.5v8a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5zm-6 0a.5.5 0 0 1 .5.5v3.793l4.146-4.147a.5.5 0 0 1 .708.708L6.207 8l4.147 4.146a.5.5 0 0 1-.708.708L5.5 8.707V12a.5.5 0 0 1-1 0V4a.5.5 0 0 1 .5-.5z"/></svg>
        </button>
        
        <button class="btn-play-pause" id="play-btn" onclick="togglePlay()">
          <svg id="play-icon" width="20" height="20" fill="currentColor" viewBox="0 0 16 16"><path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/></svg>
        </button>
        
        <button class="btn-circle" onclick="nextSong()">
          <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M5 3.5a.5.5 0 0 0-.5.5v8a.5.5 0 0 0 1 0V4a.5.5 0 0 0-.5-.5zm6 0a.5.5 0 0 0-.5.5v3.793L6.354 3.646a.5.5 0 1 0-.708.708L9.793 8l-4.147 4.146a.5.5 0 0 0 .708.708L10.5 8.707V12a.5.5 0 0 0 1 0V4a.5.5 0 0 0-.5-.5z"/></svg>
        </button>
      </div>

      <div class="progress-bar-container">
        <span id="current-time">0:00</span>
        <input type="range" class="progress-bar" id="seek-bar" value="0" max="100">
        <span id="total-time">0:00</span>
      </div>

      <audio id="audio-player"></audio>
    </div>

    <!-- Centered Footer Section -->
    <div class="player-footer">
      Songs Powered by <span>A5vnxi</span>
    </div>
  </div>

  <script>
    // ==========================================
    // SECRET PASSCODE SYSTEM
    // ==========================================
    const CORRECT_CODE = "A5vn"; // Set your secret code here!

    const overlay = document.getElementById('access-overlay');
    const accessCard = document.getElementById('access-card');
    const passcodeBtn = document.getElementById('unlock-btn');
    const passcodeInput = document.getElementById('secret-passcode');
    const errorMsg = document.getElementById('error-msg');

    function checkPasscode() {
      const enteredCode = passcodeInput.value.trim();
      
      if (enteredCode === CORRECT_CODE) {
        errorMsg.textContent = "";
        overlay.classList.add('unlocked');
        // Initial music load after unlocking
        fetchHindiSongs("Zalim");
      } else {
        errorMsg.textContent = "Incorrect passcode! Try again.";
        accessCard.classList.remove('shake');
        void accessCard.offsetWidth; // Trigger reflow
        accessCard.classList.add('shake');
        passcodeInput.value = "";
        passcodeInput.focus();
      }
    }

    passcodeBtn.addEventListener('click', checkPasscode);
    passcodeInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPasscode();
    });

    // ==========================================
    // MAIN MUSIC PLAYER SYSTEM
    // ==========================================
    const API_JIOSAAVN = "https://saavn.sumit.co/api/search/songs?query=";
    const API_ITUNES = "https://itunes.apple.com/search?media=music&entity=song&term=";

    const longMixPlaylists = [
      { id: "mix1", title: "Bollywood Romantic Mashup", artist: "Non-Stop Hindi Mix", streamUrl: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3", artwork: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=100" },
      { id: "mix2", title: "Arijit Singh Melodies", artist: "Arijit Hit Collection", streamUrl: "https://cdn.pixabay.com/download/audio/2022/01/18/audio_d0a13f69d2.mp3", artwork: "https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=100" },
      { id: "mix3", title: "Hindi Midnight Lo-Fi", artist: "Chill Chillout Mix", streamUrl: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3", artwork: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100" }
    ];

    let currentTracks = [];
    let currentTrackIndex = 0;
    let favoritesList = JSON.parse(localStorage.getItem('redmusic_favs_v9') || '[]');
    let currentTab = 'search';
    let suggestionDebounce = null;

    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');
    const suggestionsBox = document.getElementById('suggestions-box');
    const resultsList = document.getElementById('results-list');
    const audioPlayer = document.getElementById('audio-player');
    const playIcon = document.getElementById('play-icon');
    const seekBar = document.getElementById('seek-bar');
    const currentTimeEl = document.getElementById('current-time');
    const totalTimeEl = document.getElementById('total-time');

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-search').classList.toggle('active', tab === 'search');
      document.getElementById('tab-mixes').classList.toggle('active', tab === 'mixes');
      document.getElementById('tab-favs').classList.toggle('active', tab === 'favs');

      document.getElementById('search-section').style.display = tab === 'search' ? 'block' : 'none';
      suggestionsBox.style.display = 'none';

      if (tab === 'mixes') {
        currentTracks = longMixPlaylists;
        renderTrackList(currentTracks);
      } else if (tab === 'favs') {
        renderFavorites();
      } else {
        if (currentTracks.length === 0) {
          fetchHindiSongs("Zalim");
        } else {
          renderTrackList(currentTracks);
        }
      }
    }

    function quickSearch(term) {
      searchInput.value = term;
      suggestionsBox.style.display = 'none';
      fetchHindiSongs(term);
    }

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      clearTimeout(suggestionDebounce);

      if (query.length < 2) {
        suggestionsBox.style.display = 'none';
        return;
      }

      suggestionDebounce = setTimeout(() => {
        fetchSuggestions(query);
      }, 250);
    });

    async function fetchSuggestions(query) {
      try {
        const res = await fetch(`${API_JIOSAAVN}${encodeURIComponent(query)}`);
        const data = await res.json();
        
        if (data && data.data && data.data.results && data.data.results.length > 0) {
          renderSuggestions(data.data.results.slice(0, 5));
        } else {
          suggestionsBox.style.display = 'none';
        }
      } catch (e) {
        suggestionsBox.style.display = 'none';
      }
    }

    function renderSuggestions(list) {
      suggestionsBox.innerHTML = '';
      list.forEach(item => {
        const title = item.name ? item.name.replace(/&quot;/g, '"').replace(/&#039;/g, "'") : '';
        const artist = item.artists && item.artists.primary && item.artists.primary[0] ? item.artists.primary[0].name : '';

        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<span>🎵 ${title}</span> <span class="artist-tag">${artist}</span>`;
        div.addEventListener('click', () => {
          searchInput.value = title;
          suggestionsBox.style.display = 'none';
          fetchHindiSongs(title);
        });
        suggestionsBox.appendChild(div);
      });
      suggestionsBox.style.display = 'block';
    }

    document.addEventListener('click', (e) => {
      if (!searchInput.contains(e.target) && !suggestionsBox.contains(e.target)) {
        suggestionsBox.style.display = 'none';
      }
    });

    async function fetchHindiSongs(query) {
      if (!query.trim()) return;
      suggestionsBox.style.display = 'none';
      resultsList.innerHTML = '<div class="loading-spinner">⚡ Searching for songs...</div>';

      try {
        const res = await fetch(`${API_JIOSAAVN}${encodeURIComponent(query)}`);
        const data = await res.json();
        
        if (data && data.data && data.data.results && data.data.results.length > 0) {
          currentTracks = data.data.results.map(item => {
            const streamObj = item.downloadUrl ? item.downloadUrl[item.downloadUrl.length - 1] : null;
            const imgObj = item.image ? item.image[item.image.length - 1] : null;
            return {
              id: item.id || Math.random().toString(),
              title: item.name ? item.name.replace(/&quot;/g, '"').replace(/&#039;/g, "'") : 'Hindi Song',
              artist: item.artists && item.artists.primary && item.artists.primary[0] ? item.artists.primary[0].name : 'Artist',
              streamUrl: streamObj ? streamObj.url : '',
              artwork: imgObj ? imgObj.url : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100'
            };
          }).filter(t => t.streamUrl !== '');

          if (currentTracks.length > 0) {
            renderTrackList(currentTracks);
            return;
          }
        }
      } catch (e) {
        console.warn("Engine 1 failed, trying fallback...", e);
      }

      try {
        const res2 = await fetch(`${API_ITUNES}${encodeURIComponent(query + ' Hindi')}`);
        const data2 = await res2.json();

        if (data2 && data2.results && data2.results.length > 0) {
          currentTracks = data2.results.map(item => ({
            id: item.trackId ? item.trackId.toString() : Math.random().toString(),
            title: item.trackName || 'Hindi Track',
            artist: item.artistName || 'Bollywood Artist',
            streamUrl: item.previewUrl || '',
            artwork: item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '200x200bb') : 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100'
          })).filter(t => t.streamUrl !== '');

          if (currentTracks.length > 0) {
            renderTrackList(currentTracks);
            return;
          }
        }
      } catch (e) {
        console.error("Engine 2 failed:", e);
      }

      resultsList.innerHTML = `<div style="padding:20px; color:#777; font-size:12px; text-align:center;">No audio stream found for "${query}". Try another search!</div>`;
    }

    function renderTrackList(tracks) {
      resultsList.innerHTML = '';
      tracks.forEach((track, index) => {
        const isFav = favoritesList.some(f => f.id === track.id);

        const li = document.createElement('li');
        li.className = `track-item ${index === currentTrackIndex ? 'active' : ''}`;

        li.innerHTML = `
          <img src="${track.artwork}" alt="Cover" onerror="this.src='https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100'">
          <div class="track-info">
            <div class="track-title">${track.title}</div>
            <div class="track-artist">${track.artist}</div>
          </div>
          <button class="fav-btn ${isFav ? 'active' : ''}">${isFav ? '❤️' : '🤍'}</button>
        `;

        li.querySelector('.fav-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          toggleFavorite(track);
          li.querySelector('.fav-btn').textContent = favoritesList.some(f => f.id === track.id) ? '❤️' : '🤍';
        });

        li.addEventListener('click', () => playTrack(index));
        resultsList.appendChild(li);
      });
    }

    function playTrack(index) {
      if (!currentTracks[index]) return;
      currentTrackIndex = index;
      const track = currentTracks[index];

      audioPlayer.src = track.streamUrl;
      updatePlayIcon(true);
      
      audioPlayer.play().catch(err => {
        console.log("Playback error or interaction required:", err);
      });

      renderTrackList(currentTracks);
    }

    function togglePlay() {
      if (!audioPlayer.src) {
        if (currentTracks.length > 0) playTrack(0);
        return;
      }

      if (audioPlayer.paused) {
        audioPlayer.play();
        updatePlayIcon(true);
      } else {
        audioPlayer.pause();
        updatePlayIcon(false);
      }
    }

    function updatePlayIcon(isPlaying) {
      if (isPlaying) {
        playIcon.innerHTML = `<path d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"/>`;
      } else {
        playIcon.innerHTML = `<path d="M11.596 8.697l-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"/>`;
      }
    }

    function nextSong() {
      if (currentTrackIndex < currentTracks.length - 1) playTrack(currentTrackIndex + 1);
      else playTrack(0);
    }

    function prevSong() {
      if (currentTrackIndex > 0) playTrack(currentTrackIndex - 1);
      else playTrack(currentTracks.length - 1);
    }

    audioPlayer.addEventListener('timeupdate', () => {
      if (audioPlayer.duration) {
        const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
        seekBar.value = progress;
        currentTimeEl.textContent = formatTime(audioPlayer.currentTime);
        totalTimeEl.textContent = formatTime(audioPlayer.duration);
      }
    });

    seekBar.addEventListener('input', () => {
      if (audioPlayer.duration) {
        audioPlayer.currentTime = (seekBar.value / 100) * audioPlayer.duration;
      }
    });

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    audioPlayer.addEventListener('ended', () => nextSong());

    function toggleFavorite(song) {
      const idx = favoritesList.findIndex(f => f.id === song.id);
      if (idx > -1) favoritesList.splice(idx, 1);
      else favoritesList.push(song);

      localStorage.setItem('redmusic_favs_v9', JSON.stringify(favoritesList));
      if (currentTab === 'favs') renderFavorites();
    }

    function renderFavorites() {
      if (favoritesList.length === 0) {
        resultsList.innerHTML = '<div style="padding:20px; color:#777; font-size:12px; text-align:center;">No favorite songs saved yet.</div>';
        return;
      }

      currentTracks = favoritesList;
      renderTrackList(favoritesList);
    }

    searchBtn.addEventListener('click', () => {
      fetchHindiSongs(searchInput.value.trim());
    });

    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        fetchHindiSongs(searchInput.value.trim());
      }
    });
  </script>

</body>
</html>
